<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>IELTS 8.5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#16161A; --mute:#6B6A66; --line:#E6E2D9;
  --acc:#FFC72C; --acc-ink:#16161A;
  --L:#2F6FEB; --R:#15803D; --W:#E2561B; --S:#8B3FD9; --V:#57534E; --X:#16161A;
  --ok:#15803D; --bad:#C2410C;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 90px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand h1 b{background:var(--acc);padding:0 6px;border-radius:6px}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.on{background:var(--ok)} .dot.local{background:#D97706}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px Manrope,system-ui,sans-serif;padding:8px 13px;border-radius:999px;cursor:pointer}
nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.hero{background:var(--ink);color:#fff;border:none}
.hero .big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--acc)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero small{color:#B9B7B0;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:#24242A;border-radius:12px;padding:10px}
.stat .v{font-size:20px;font-weight:700}
.stat .k{font-size:11.5px;color:#B9B7B0}
h2{font-size:16px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
h3{font-size:14px;font-weight:700;margin:12px 0 6px}
.mute{color:var(--mute);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--acc);color:var(--acc-ink)}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.datenav .d{text-align:center;font-weight:700}
.task{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.task:first-of-type{border-top:none}
.cb{flex:0 0 24px;height:24px;border-radius:8px;border:2px solid #C9C4B8;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s}
.task.done .cb{background:var(--ok);border-color:var(--ok)}
.task.done .cb::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.tt{font-weight:700;font-size:14.5px}
.how{font-size:12.5px;color:var(--mute);margin-top:2px}
.tag{display:inline-block;font:700 11px "JetBrains Mono",ui-monospace,monospace;color:#fff;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.min{margin-left:auto;font:600 12.5px "JetBrains Mono",ui-monospace,monospace;color:var(--mute);white-space:nowrap}
.bar{height:10px;background:#EEEAE1;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wd{text-align:center;font-size:11px;color:var(--mute)}
.wd .sq{height:30px;border-radius:9px;background:#EEEAE1;margin-top:4px;display:flex;align-items:center;justify-content:center;font:700 11px "JetBrains Mono",ui-monospace,monospace;color:var(--ink)}
.wd .sq.p{background:#FDE68A}.wd .sq.f{background:var(--ok);color:#fff}.wd .sq.t{outline:2px solid var(--ink)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.cell .k{font:700 12px "JetBrains Mono",ui-monospace,monospace}
.cell .v{font:700 20px "JetBrains Mono",ui-monospace,monospace}
.cell .s{font-size:11.5px;color:var(--mute)}
.up{color:var(--bad)} .okc{color:var(--ok)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:500 15px Manrope,system-ui,sans-serif;color:var(--ink);background:#FBFAF7;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink);background:#fff}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 16px;font:700 14.5px Manrope,system-ui,sans-serif;cursor:pointer;background:var(--ink);color:#fff;width:100%;margin-top:12px}
.btn.y{background:var(--acc);color:var(--acc-ink)}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;background:#EEEAE1;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:9px;font:700 13px Manrope,system-ui,sans-serif;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:none}
.x{margin-left:auto;border:none;background:none;color:#A8A29E;font-size:18px;cursor:pointer;padding:0 4px}
.hbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.hbar .lb{flex:0 0 46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:8px;background:#EEEAE1;border-radius:9px;overflow:hidden}
.hbar .tr i{display:block;height:100%}
.hbar .n{font:700 12px "JetBrains Mono",ui-monospace,monospace;width:22px;text-align:right}
.flash{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.flash .term{font-size:22px;font-weight:800;letter-spacing:-.01em}
.flash .mean{font-size:15px}
.flash .ex{font-size:13px;color:var(--mute);font-style:italic}
.timer{font:700 64px "JetBrains Mono",ui-monospace,monospace;text-align:center;letter-spacing:-.03em;margin:8px 0}
.timer.prep{color:#D97706}.timer.talk{color:var(--S)}
.cue{background:#FBFAF7;border:1px solid var(--line);border-radius:14px;padding:14px}
.cue b{font-size:16px}
.cue ul{margin:8px 0 0 18px;font-size:14px}
.res .band{font:700 40px "JetBrains Mono",ui-monospace,monospace;color:var(--W)}
.res .fx{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.res .orig{color:var(--mute);text-decoration:line-through;font-size:13.5px}
.res .impr{font-weight:600;font-size:14px;margin-top:3px}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
details summary::-webkit-details-marker{display:none}
.note{font-size:12.5px;color:var(--mute);background:#FBFAF7;border-radius:10px;padding:10px;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;background:currentColor;margin-right:5px;vertical-align:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw}
.toast.show{opacity:1}
a{color:var(--L)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>IELTS <b>8.5</b></h1>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">загрузка…</span></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const todayStr=()=>ymd(new Date());
const fmtD=(s,o)=>parseD(s).toLocaleDateString('ru-RU',o||{weekday:'short',day:'numeric',month:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fx=v=>v==null||isNaN(v)?'—':Number(v).toFixed(1);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200);}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;}

/* ---------- IELTS maths ---------- */
const LIS=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[11,4],[8,3.5],[6,3],[4,2.5],[0,0]];
const RAC=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,0]];
const RGT=[[40,9],[39,8.5],[37,8],[36,7.5],[34,7],[32,6.5],[30,6],[27,5.5],[23,5],[19,4.5],[15,4],[12,3.5],[9,3],[6,2.5],[0,0]];
const conv=(t,raw)=>{for(const [m,b] of t) if(raw>=m) return b; return 0;};
function overallBand(arr){
  const a=Math.round(arr.reduce((s,x)=>s+x,0)/arr.length*1000)/1000;
  const f=Math.floor(a), r=a-f;
  return r<0.25?f:(r<0.75?f+0.5:f+1);
}
const SEC={L:'Listening',R:'Reading',W:'Writing',S:'Speaking',V:'Лексика',X:'Общее'};

/* ---------- storage: Telegram CloudStorage with local fallback ---------- */
const TG=(window.Telegram&&Telegram.WebApp)||null;
const inTG=!!(TG&&TG.initData);
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor&&TG.setHeaderColor('#F5F3EE');TG.setBackgroundColor&&TG.setBackgroundColor('#F5F3EE');}catch(e){}}
const CS=inTG&&TG.CloudStorage&&(!TG.isVersionAtLeast||TG.isVersionAtLeast('6.9'))?TG.CloudStorage:null;
const hap=(k)=>{try{if(!inTG)return;k==='ok'?TG.HapticFeedback.notificationOccurred('success'):TG.HapticFeedback.impactOccurred('light');}catch(e){}};
const COLLS=['ielts_meta','ielts_days','ielts_mocks','ielts_essays','ielts_mistakes'];
const S={}; COLLS.forEach(c=>S[c]={});
const LS='ielts85_tg_v1';
try{const raw=localStorage.getItem(LS); if(raw){const o=JSON.parse(raw); COLLS.forEach(c=>{if(o[c])S[c]=o[c];});}}catch(e){}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
let dbMode='loading', cloudReady=false;
const csP=(fn,...a)=>new Promise((res,rej)=>{try{CS[fn](...a,(err,val)=>err?rej(err):res(val));}catch(e){rej(e);}});
const cloudKey=(c,id)=>c==='ielts_days'?'d_'+id:c==='ielts_meta'?'m_'+id:'c_'+c;
const cloudVal=(c,id)=>c==='ielts_days'?S.ielts_days[id]:c==='ielts_meta'?S.ielts_meta[id]:S[c];
const chunkN={}, chains={}, timers={}, pend={};
async function cloudSave(key,val){
  const str=val===undefined?'':JSON.stringify(val), N=3800, parts=[];
  for(let i=0;i<str.length;i+=N) parts.push(str.slice(i,i+N));
  for(let i=0;i<parts.length;i++) await csP('setItem',key+'_p'+i,parts[i]);
  await csP('setItem',key,String(parts.length));
  const old=chunkN[key]||0; if(old>parts.length){const rm=[];for(let i=parts.length;i<old;i++)rm.push(key+'_p'+i);await csP('removeItems',rm);}
  chunkN[key]=parts.length;
}
function queueSave(c,id){
  const key=cloudKey(c,id); pend[key]=[c,id];
  if(!CS||!cloudReady) return;
  clearTimeout(timers[key]);
  timers[key]=setTimeout(()=>{ delete pend[key];
    chains[key]=(chains[key]||Promise.resolve()).then(()=>cloudSave(key,cloudVal(c,id))).catch(()=>{toast('Не сохранилось в облако Telegram — сохранено на устройстве');});
  },450);
}
function put(c,id,data){ S[c]={...S[c],[id]:data}; saveLocal(); refresh(); queueSave(c,id); }
function del(c,id){ const o={...S[c]}; delete o[id]; S[c]=o; saveLocal(); refresh(); queueSave(c,id); }
function setSync(mode,txt){dbMode=mode;$('#syncDot').className='dot '+(mode==='on'?'on':mode==='local'?'local':'');$('#syncTxt').textContent=txt;}
async function cloudLoad(){
  const keys=await csP('getKeys'); const vals={};
  for(let i=0;i<keys.length;i+=20) Object.assign(vals,await csP('getItems',keys.slice(i,i+20)));
  const out={}; COLLS.forEach(c=>out[c]={}); let heads=0;
  keys.filter(k=>!/_p\d+$/.test(k)).forEach(k=>{
    const n=parseInt(vals[k],10); if(!(n>=0)) return; heads++; chunkN[k]=n;
    let str=''; for(let i=0;i<n;i++) str+=vals[k+'_p'+i]||''; if(!str) return;
    let v; try{v=JSON.parse(str);}catch(e){return;}
    if(k.startsWith('d_')) out.ielts_days[k.slice(2)]=v; else if(k.startsWith('m_')) out.ielts_meta[k.slice(2)]=v; else if(k.startsWith('c_')&&COLLS.includes(k.slice(2))) out[k.slice(2)]=v;
  });
  return {out,heads};
}
(async()=>{
  if(!CS){ setSync('local',inTG?'сохранено на этом устройстве':'открой через Telegram-бота'); return; }
  setSync('loading','синхронизация…');
  try{
    const {out,heads}=await cloudLoad();
    const local=JSON.parse(JSON.stringify(S)); const pk={...pend};
    if(heads===0){
      cloudReady=true;
      COLLS.forEach(c=>{ if(c==='ielts_days'||c==='ielts_meta') Object.keys(S[c]).forEach(id=>queueSave(c,id)); else if(Object.keys(S[c]).length) queueSave(c,'all'); });
    } else {
      COLLS.forEach(c=>S[c]=out[c]);
      Object.values(pk).forEach(([c,id])=>{ if(c==='ielts_days'||c==='ielts_meta'){ if(local[c][id]!==undefined) S[c]={...S[c],[id]:local[c][id]}; } else S[c]={...S[c],...local[c]}; });
      cloudReady=true; Object.values(pk).forEach(([c,id])=>queueSave(c,id));
    }
    saveLocal(); setSync('on','облако Telegram ✓'); refresh();
  }catch(e){ setSync('local','облако недоступно — сохраняю на устройстве'); }
})();
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="http"]'); if(!a) return; e.preventDefault(); try{ inTG?TG.openLink(a.href):window.open(a.href,'_blank'); }catch(_){ location.href=a.href; }});

/* ---------- settings ---------- */
const DEF={examDate:'2027-01-09',start:'2026-11-01',module:'Academic',tL:9,tR:8.5,tW:7.5,tS:8};
const settings=()=>Object.assign({},DEF,(S.ielts_meta.settings)||{});

/* ---------- plan ---------- */
const T=(sec,title,min,how='')=>({sec,title,min,how});
const VOC=(m=15)=>T('V','Лексика: карточки дня + 5 новых коллокаций',m,'Вкладка «Слова». Новые берёшь из сегодняшних текстов и разборов эссе.');
const PH={
 p1:{name:'Фаза 1 · Фундамент',focus:'Структура Writing на 8 и техника Reading по каждому типу вопросов.'},
 p2:{name:'Фаза 2 · Интенсив',focus:'Всё на время, больше объёма, каждая ошибка — в журнал с причиной.'},
 p3:{name:'Фаза 3 · Моки',focus:'Экзаменационные условия. Суббота — полный мок L+R+W, воскресенье — разбор.'},
 tp:{name:'Разгрузка',focus:'Держим форму, ничего нового. Сон важнее лишнего теста.'}
};
const P1={
 1:[T('W','Task 2 эссе на время (opinion) — 40 мин',40,'Cambridge 15–19, 270–300 слов. Сразу вставь во вкладку Writing → проверка.'),T('W','Переписать 2 слабых абзаца по разбору',20,'Закрой каждое замечание по CC и LR.'),T('R','1 passage на T/F/NG — 20 мин',20,'Каждую ошибку — в «Ошибки» с причиной: не нашёл / неверно понял / спутал NG и F.'),VOC()],
 2:[T('R','Matching headings: 2 сета по 20 мин',40,'Сначала только первое и последнее предложение абзаца. Ошибки — в журнал.'),T('L','Section 3: тест, затем повтор с транскриптом',25,'Отметь в транскрипте, где был ответ и где ловушка.'),T('S','Part 1: 6 вопросов вслух, по 3–4 предложения',10,'Без «ээ»: “That’s an interesting one…”, “Off the top of my head…”'),VOC()],
 3:[T('W','Task 1 (график/таблица) — 20 мин',20,'Overview обязательно во 2-м абзаце. Проверь как Task 1.'),T('W','3 плана эссе по 5 мин',15,'Thesis + 2 идеи + конкретный пример на каждую.'),T('S','Part 2: 2 карточки с таймером + запись',20,'Вкладка Speaking. Переслушай: паузы, повторы слов, ошибки времён.'),T('R','Summary completion: 1 сет',20,'Сначала предскажи часть речи для каждого пропуска.'),VOC()],
 4:[T('R','Полный Reading-тест — 60 мин',60,'Без перерыва. Сырой балл — во вкладку «Моки» (только R).'),T('R','Разбор ошибок по типам вопросов',20,'Все ошибки — в журнал. Смотри, какой тип даёт больше всего минусов.'),VOC()],
 5:[T('W','Task 2 эссе (discussion) — 40 мин',40,'Своё мнение — и во введении, и в заключении.'),T('W','Проверка + 5 улучшенных фраз в «Слова»',15),T('L','Section 4: тест + spelling-ошибки в журнал',20),VOC()],
 6:[T('L','Полный Listening — 40 мин с переносом',40,'Балл — во вкладку «Моки».'),T('W','Task 2 эссе — 40 мин',40,'Тип эссе, где был самый низкий балл.'),T('W','Проверка + переписать эссе целиком',20),VOC()],
 0:[T('X','Ревизия недели: журнал ошибок → 3 правила',25,'Вкладка «Ошибки» → топ типов. Пример правила: «NG — если информации в тексте нет вообще».'),T('W','Переписать худшее эссе недели на Band 8',30),T('S','Part 3: 4 вопроса по 45–60 сек',15,'Ответ → причина → пример → оговорка.'),VOC()]
};

function planFor(ds){
  const st=settings(); const d=daysBetween(ds,st.examDate);
  if(ds<st.start) return {key:'pre',name:'До старта',focus:'План начинается '+fmtD(st.start,{day:'numeric',month:'long'})+'.',tasks:[]};
  if(d<0) return {key:'post',name:'После экзамена',focus:'Экзамен позади.',tasks:[]};
  if(d===0) return {key:'exam',name:'День экзамена',focus:'Всё уже сделано. Спокойно.',tasks:[T('X','Экзамен. Паспорт, вода, прийти за 30–40 мин',1)]};
  if(ds===st.start) return {key:'diag',name:'Старт · Диагностика',focus:'Сегодня меряем точку А: Reading и Writing, твои слабые секции.',tasks:[
    T('R','Полный Reading-тест — 60 мин',60,'Cambridge 19 или 18, Test 1. Сырой балл — во вкладку «Моки».'),
    T('W','Task 2 эссе — 40 мин, потом проверка в Claude',40,'Вкладка Writing → «Проверить в Claude» → внеси 4 балла. Это стартовый балл по Writing.'),
    T('X','Заполнить «Моки»: R и W',5,'Без цифр не будет плана коррекции.')]};
  if(d===1) return {key:'rest',name:'Накануне',focus:'Отдых. Сон — до 23:00.',tasks:[VOC(10),T('X','Паспорт, маршрут до центра, время выхода',5)]};
  const wd=parseD(ds).getDay();
  if(d<=4) return {key:'tp',...PH.tp,tasks:[T('R','1 passage — 20 мин',20),T('L','1 section — 10 мин',10),T('S','Разминка Part 1–2',10),T('X','Перечитать свои правила и топ ошибок',15),VOC(10)]};
  if(d<=24) return {key:'p3',...PH.p3,tasks:P3[wd]};
  if(d<=48) return {key:'p2',...PH.p2,tasks:P2[wd]};
  return {key:'p1',...PH.p1,tasks:P1[wd]};
}
function dayStats(ds){
  const p=planFor(ds); const day=S.ielts_days[ds]||{done:[]}; const done=new Set(day.done||[]);
  let tot=0,dm=0; p.tasks.forEach((t,i)=>{tot+=t.min; if(done.has(i)) dm+=t.min;});
  return {p,done,tot,dm,ratio:tot?dm/tot:0};
}
function streak(){
  const st=settings(); let ds=todayStr(); let n=0;
  if(dayStats(ds).ratio<0.8) ds=addDays(ds,-1);
  while(ds>=st.start){ const s=dayStats(ds); if(!s.p.tasks.length) break; if(s.ratio>=0.8){n++; ds=addDays(ds,-1);} else break; }
  return n;
}

function latest(){
  const out={L:null,R:null,W:null,S:null};
  mocksSorted().forEach(m=>{['L','R','W','S'].forEach(k=>{if(m[k]!=null) out[k]=m[k];});});

  return out;
}

function chart(ms,st){
  const W=340,H=190,p={l:30,r:12,t:12,b:24}; const lo=5,hi=9;
  const n=ms.length; const x=i=>p.l+(n<2?(W-p.l-p.r)/2:i*(W-p.l-p.r)/(n-1));
  const y=v=>p.t+(hi-Math.max(lo,Math.min(hi,v)))/(hi-lo)*(H-p.t-p.b);
  let g=''; for(let v=lo;v<=hi;v++){g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#ECE8DF"/><text x="${p.l-8}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#8A877F" font-family="JetBrains Mono">${v}</text>`;}
  const tgt=overallBand([st.tL,st.tR,st.tW,st.tS]);
  g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="#16161A" stroke-dasharray="4 4"/><text x="${W-p.r}" y="${y(tgt)-4}" font-size="10" text-anchor="end" fill="#16161A" font-family="JetBrains Mono">цель ${tgt}</text>`;
  const ser=[['L','#2F6FEB'],['R','#15803D'],['W','#E2561B'],['S','#8B3FD9'],['overall','#16161A']];
  ser.forEach(([k,c])=>{const pts=ms.map((m,i)=>m[k]!=null?[x(i),y(m[k])]:null).filter(Boolean); if(!pts.length)return;
    g+=`<polyline fill="none" stroke="${c}" stroke-width="${k==='overall'?3:2}" stroke-linejoin="round" points="${pts.map(q=>q.join(',')).join(' ')}"/>`+pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.2" fill="${c}"/>`).join('');});
  [0,n-1].filter((v,i,a)=>a.indexOf(v)===i&&v>=0).forEach(i=>{g+=`<text x="${x(i)}" y="${H-6}" font-size="10" text-anchor="${n<2?'middle':i===0?'start':'end'}" fill="#8A877F">${fmtD(ms[i].date,{day:'numeric',month:'short'})}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="График баллов">${g}</svg>
  <div class="legend"><span style="color:#2F6FEB">L</span><span style="color:#15803D">R</span><span style="color:#E2561B">W</span><span style="color:#8B3FD9">S</span><span style="color:#16161A">Overall</span></div>`;
}

function copyText(t){

}
function fallbackCopy(t){ try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}catch(e){} }
function examinerPrompt(task,prompt,essay){

 return `Act as a senior, calibrated IELTS Writing examiner. Assess my Academic Writing ${t1?'Task 1':'Task 2'} response strictly against the official public band descriptors (${t1?'Task Achievement':'Task Response'}, Coherence and Cohesion, Lexical Resource, Grammatical Range and Accuracy). Do not inflate: give 8+ for a criterion only if it clearly meets the band 8 descriptor. Minimum length ${min} words. I am aiming for band 8.

Answer in Russian (keep quoted English in English):
1) Балл по каждому критерию с одной фразой обоснования.
2) 3 правки с самым большим эффектом на балл.
3) 3–5 моих предложений, переписанных на уровень 8–9.
4) Что отделяет текст от следующего балла.
Last line exactly: ИТОГ: ${t1?'TA':'TR'} x · CC x · LR x · GRA x

TASK: ${prompt||'(not given — infer it from the response)'}

MY RESPONSE (${wc(essay)} words):
${essay}`;
}

   ${!(S.ielts_meta.vocab||{}).starter?`<button class="btn g" id="vStarter">+ Стартовый набор: 30 коллокаций Band 8</button>`:''}
   <div class="mute" style="margin-top:10px">Всего ${items.length} · выучено (уровень 4–5): ${byBox[4]+byBox[5]}</div></section>
   ${items.length?`<section class="card"><details><summary><span>Словарь · ${items.length}</span><span class="mute">открыть</span></summary><div class="list">${items.slice().reverse().slice(0,60).map(x=>`<div class="it"><div style="flex:1;min-width:0"><b>${esc(x.t)}</b> — ${esc(x.m)}<div class="mute">ур. ${x.box||0} · след. ${fmtD(x.due,{day:'numeric',month:'short'})}</div></div><button class="x" data-delv="${x.id}" aria-label="Удалить">×</button></div>`).join('')}</div></details></section>`:''}`;
 }
};

/* ---------- SPEAKING ---------- */
let cueI=Math.floor(Math.random()*CUES.length), sT=null, sLeft=0, sPhase='';
V.speak={
 build:()=>`<section class="card"><h2>Part 2 · карточка</h2><div id="cue"></div>
   <div class="timer num" id="sTm">2:00</div><div class="mute" style="text-align:center" id="sPh">1 мин подготовка → 2 мин речь. Включи диктофон на телефоне.</div>
   <div class="row2"><button class="btn g" id="sNew">Другая карточка</button><button class="btn y" id="sGo">Старт</button></div></section>
  <section class="card"><h2>Чек-лист Band 8 после записи</h2><div class="list">
   ${['Говорил все 2 минуты, без длинных пауз','Минимум 2 идиоматичные фразы к месту (не заученные)','Есть сложные предложения: условные, пассив, относительные','Не повторял одно слово больше 2 раз — использовал синонимы','Интонация: выделял ключевые слова, не монотонно','Ответы в Part 3 по схеме: ответ → причина → пример → оговорка'].map(t=>`<div class="it"><span>☐</span><span>${t}</span></div>`).join('')}</div></section>`,
 init(){
  const show=()=>{const c=CUES[cueI];$('#cue').innerHTML=`<div class="cue"><b>${esc(c[0])}.</b><div class="mute" style="margin-top:6px">You should say:</div><ul>${c[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><h3>Part 3</h3>${c[2].map(q=>`<p style="font-size:14px;margin:4px 0">• ${esc(q)}</p>`).join('')}`;};
  const draw=()=>{const e=$('#sTm');if(!e)return;e.textContent=`${Math.floor(sLeft/60)}:${pad(sLeft%60)}`;e.className='timer num '+(sPhase==='prep'?'prep':sPhase==='talk'?'talk':'');$('#sPh').textContent=sPhase==='prep'?'Подготовка: записывай ключевые слова':sPhase==='talk'?'Говори! Не останавливайся до сигнала':'1 мин подготовка → 2 мин речь. Включи диктофон на телефоне.';$('#sGo').textContent=sT?'Стоп':'Старт';};
  show(); if(!sT){sLeft=120;} draw();
  $('#sNew').onclick=()=>{cueI=(cueI+1+Math.floor(Math.random()*(CUES.length-1)))%CUES.length;show();};
  $('#sGo').onclick=()=>{
   if(sT){clearInterval(sT);sT=null;sPhase='';sLeft=120;draw();return;}
   sPhase='prep';sLeft=60;draw();
   sT=setInterval(()=>{sLeft--; if(sLeft<=0){ if(sPhase==='prep'){sPhase='talk';sLeft=120;toast('Говори!');} else {clearInterval(sT);sT=null;sPhase='';sLeft=0;toast('2 минуты — стоп. Переслушай запись.');} } draw();},1000);
  };
 }
};

/* ---------- SETTINGS ---------- */
V.set={
 build:()=>{const st=settings();return `<section class="card"><h2>Экзамен и цели</h2>
  <div class="row2"><div><label>Дата экзамена</label><input type="date" id="sE" value="${st.examDate}"></div><div><label>Старт плана</label><input type="date" id="sSt" value="${st.start}"></div></div>
  <label>Модуль</label><select id="sMod"><option ${st.module==='Academic'?'selected':''}>Academic</option><option value="General" ${st.module==='General'?'selected':''}>General Training</option></select>
  <h3>Цель по секциям</h3>
  <div class="grid4">${['L','R','W','S'].map(k=>`<div><label style="color:var(--${k})">${k}</label><select id="t${k}">${bandOpts(st['t'+k]).replace('<option value="" >—</option>','')}</select></div>`).join('')}</div>
  <p class="mute" id="sOv" style="margin-top:8px"></p>
  <button class="btn" id="sSave">Сохранить</button></section>
  <section class="card"><h2>Как устроен план</h2><p class="mute">Фаза 1 «Фундамент» → Фаза 2 «Интенсив» (за 48 дней до экзамена) → Фаза 3 «Моки» (за 24 дня) → разгрузка (последние 4 дня). День засчитывается, если выполнено ≥80% минут. Дату можно поменять — план пересчитается.</p>
  <p class="mute" style="margin-top:8px">Данные хранятся в облаке Telegram и видны на всех твоих устройствах. Материалы: Cambridge IELTS 15–19 (Academic), <a href="https://ielts.org/take-a-test/preparation-resources" target="_blank" rel="noopener">ielts.org</a>, <a href="https://engnovate.com" target="_blank" rel="noopener">engnovate.com</a>.</p></section>`;},
 init(){
  const ov=()=>{const v=['L','R','W','S'].map(k=>+$('#t'+k).value);$('#sOv').innerHTML=v.some(isNaN)?'':`Overall по этим целям: <b class="num">${overallBand(v).toFixed(1)}</b> (среднее ${(v.reduce((a,b)=>a+b,0)/4).toFixed(3)})`;};
  ['L','R','W','S'].forEach(k=>$('#t'+k).onchange=ov);ov();
  $('#sSave').onclick=()=>{const e=$('#sE').value,s=$('#sSt').value;if(!e||!s||s>=e){toast('Проверь даты');return;}
   const o={examDate:e,start:s,module:$('#sMod').value==='General'?'General':'Academic'};['L','R','W','S'].forEach(k=>o['t'+k]=+$('#t'+k).value||DEF['t'+k]);
   put('ielts_meta','settings',o);toast('Сохранено');};
 }
};

renderTabs(); build();
</script>
</body>
</html>
