<title>Разведка Reels</title>

<style>
:root{
  /* layout: one phone column, sticky brand bar on top, tab bar at the bottom, dossier opens over the catalog */
  --bg:#EDF0F4; --card:#FFFFFF; --ink:#10151C; --mute:#5C6673; --line:#D9DFE6;
  --accent:#1F3FE0; --accent-soft:#E6EAFD; --hit:#D9520A; --hit-soft:#FDEBDD; --super:#B8134F; --super-soft:#FBE3EC; --good:#157F5B;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --f-num:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.bar .back{display:none;width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1}
.bar.sub .back{display:block}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap{font:500 11px var(--f-num);color:var(--mute);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.demo{font:700 11px var(--f-num);background:#FFE27A;color:#3B2F00;border-radius:6px;padding:3px 7px;letter-spacing:.04em}
main{flex:1;padding:14px 16px 96px;display:flex;flex-direction:column;gap:14px}
h1{font-size:25px;line-height:1.12;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--mute);font-size:14px;max-width:60ch}
.eyebrow{font:500 11px var(--f-num);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.tile b{display:block;font:700 20px var(--f-num);letter-spacing:-.03em}
.tile span{font-size:12px;color:var(--mute)}
.tile.h b{color:var(--hit)} .tile.s b{color:var(--super)}
.controls{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.field{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font-size:15px}
select.field{flex:0 0 168px;font-size:13.5px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{font:500 11px var(--f-num);opacity:.6;margin-left:4px}
.count{font-size:12px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:10px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.ahead{display:flex;gap:11px;align-items:center}
.ava{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-num);color:#fff}
.ava.big{width:68px;height:68px;font-size:20px}
.aname{font-weight:800;font-size:15px;line-height:1.2}
.anick{font-size:12px;color:var(--mute)}
.about{font-size:13.5px;color:#2A323D}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;font-weight:500;border:1px solid var(--line);border-radius:7px;padding:2px 7px;color:#2A323D;background:#F7F8FA}
.tag.wide{border-color:#B9E2D2;background:#EAF7F1;color:var(--good)}
.tag.narrow{border-color:#E3D6C0;background:#FAF4E8;color:#7A5A12}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--card);padding:8px 10px}
.kpi b{display:block;font:700 15px var(--f-num);letter-spacing:-.03em}
.kpi span{font-size:11px;color:var(--mute);line-height:1.2;display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:4px 10px;align-items:center;font-size:13px}
.bar-row .lab{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.bar-row .lab i{font-style:normal;color:var(--mute);font-size:12px;white-space:nowrap}
.track{height:8px;border-radius:4px;background:#E8ECF1;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.h{background:var(--hit)} .fill.g{background:#9AA5B1}
.bar-row .val{font:700 13px var(--f-num);text-align:right}
.note{font-size:13px;color:#2A323D}
.note b{font-weight:600}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px 12px}
.cover{width:76px;aspect-ratio:9/14;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:flex-end;padding:5px;color:#fff;font:700 11px var(--f-num)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover em{position:absolute;left:7px;top:7px;font:700 15px var(--f-num);font-style:normal;letter-spacing:-.03em}
.cover span{position:relative;background:rgba(0,0,0,.45);border-radius:5px;padding:1px 5px}
.rbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.rtitle{font-weight:800;font-size:14.5px;line-height:1.25}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 9px;font-size:12px;color:var(--mute)}
.rmeta .v{font:700 14px var(--f-num);color:var(--ink)}
.mult{font:700 12px var(--f-num);border-radius:6px;padding:1px 6px;background:#EEF1F4;color:var(--mute)}
.mult.h{background:var(--hit-soft);color:var(--hit)} .mult.s{background:var(--super-soft);color:var(--super)}
.quote{font-size:13.5px;color:#2A323D;border-left:3px solid var(--line);padding-left:9px}
.rwho{font-size:12px;color:var(--accent);font-weight:600;text-align:left;padding:0}
details{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "} details[open] summary::before{content:"▾ "}
.breakdown{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13px;margin-top:9px}
.breakdown dt{color:var(--mute)} .breakdown dd{margin:0}
.transcript{margin-top:9px;font-size:13.5px;color:#2A323D;background:#F7F8FA;border-radius:10px;padding:10px 11px}
.more{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;width:100%}
.cmp{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px}
.cmp div{padding:8px 9px;background:var(--card);border-bottom:1px solid var(--line)}
.cmp .hd{background:#F4F6F9;color:var(--mute);font-size:11px;font-weight:600}
.cmp .n{font:700 13px var(--f-num);letter-spacing:-.02em}
.cmp .up{color:var(--good)} .cmp .dn{color:var(--hit)}
.act{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.act h3{font-size:15px;font-weight:800;line-height:1.25}
.act p{font-size:13.5px;color:#2A323D}
.idea{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.idea h3{font-size:15.5px;font-weight:800;line-height:1.25;text-wrap:balance}
.idea .im{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
.idea .im b{font:700 13px var(--f-num);color:var(--ink)}
.ex{display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:13px}
.ex div{display:flex;justify-content:space-between;gap:10px}
.ex span:last-child{font-family:var(--f-num);white-space:nowrap}
.verdict{display:inline-block;font:700 11px var(--f-num);border-radius:6px;padding:2px 7px;letter-spacing:.03em;text-transform:uppercase}
.verdict.no{background:#EEF1F4;color:var(--mute)} .verdict.yes{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 12px;text-align:center;color:var(--mute);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{height:46px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
nav.tabs button b{font:700 11px var(--f-num);font-weight:700}
nav.tabs button[aria-current="page"]{background:var(--ink);color:#fff}
@media (min-width:480px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .35s ease}}
</style>
</head>

<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('data').textContent);
var $ = function(s, el){ return (el||document).querySelector(s); };
var view = $('#view');
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var LANG = {ru:'RU', en:'EN', uz:'UZ'};
var NICHE_COL = {'Бизнес и эксперты':['#1F3FE0','#5B77F5'], 'Путешествия и лайфстайл':['#0B7FAB','#22A9D6'], 'Узбекистан':['#157F5B','#2FB487']};
var FALL = ['#39424E','#6B7785'];

var A = {};
D.authors.forEach(function(a){ a.name = String(a.name||a.nick).split(/[|•·—\n]/)[0].trim().slice(0,30) || a.nick; a.col = (NICHE_COL[a.niche]||FALL)[0]; A[a.nick] = a; });
var HITS = D.hits;
var TAGGED = HITS.filter(function(r){ return r.core; });

function fnum(n){
  if (n == null) return '—';
  if (n >= 1e6) return (n/1e6).toFixed(n >= 1e7 ? 1 : 2).replace('.', ',').replace(/,?0+$/, '') + ' млн';
  if (n >= 1e3) return (n/1e3).toFixed(n >= 1e5 ? 0 : 1).replace('.', ',').replace(/,0$/, '') + ' тыс';
  return String(n);
}
function pct(x){ return x == null ? '—' : (x*100).toFixed(x < 0.1 ? 1 : 0).replace('.', ',') + '%'; }
function fmult(m){ return m == null ? '—' : '×' + (m >= 10 ? m.toFixed(0) : m.toFixed(1).replace('.', ',')); }
function fdate(ts){ var d = new Date(ts*1000); return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }
function fdur(s){ return s >= 60 ? Math.floor(s/60)+':'+('0'+(s%60)).slice(-2) : s+' с'; }
function dec(x){ return x == null ? '—' : String(x).replace('.', ','); }
function initials(a){ var p = (a.name||a.nick).replace(/[^A-Za-zА-Яа-яЁё ]/g,' ').trim().split(/\s+/); return ((p[0]||'').slice(0,1) + (p[1]||'').slice(0,1)).toUpperCase() || a.nick.slice(0,2).toUpperCase(); }
function ava(a, big){ return '<div class="ava'+(big?' big':'')+'" style="background:'+a.col+'">'+esc(initials(a))+'</div>'; }

var S = { tab:'catalog', author:null, q:'', sort:'median', lang:'all', niche:'all', hq:'', hniche:'all', hlang:'all', hsort:'mult', onlySuper:false, hAuthor:null, hLimit:30, ideasMulti:true };
var TABS = ['me','catalog','hits','ideas','insights'];
if (D.me) S.tab = 'me';
var BYID = {}; HITS.forEach(function(r){ BYID[r.id] = r; });
function go(tab){ S.tab = tab; S.author = null; S.hLimit = 30; try{ history.replaceState(null,'','#'+tab); }catch(e){} render(); window.scrollTo(0,0); }
function openAuthor(nick){ S.author = nick; render(); window.scrollTo(0,0); }
function back(){ S.author = null; render(); }

function reelCard(r, n, showWho){
  var a = A[r.a], col = NICHE_COL[a.niche] || FALL;
  var cls = r['super'] ? 's' : 'h';
  var who = showWho ? '<button class="rwho" data-author="'+esc(r.a)+'">'+esc(a.name)+' · @'+esc(r.a)+'</button>' : '';
  var tags = (r.hook?['<span class="tag">'+esc(r.hook)+'</span>']:[]).concat(r.theme?['<span class="tag">'+esc(r.theme)+'</span>']:[]).concat((r.f||[]).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }));
  if (r.wide != null) tags.push('<span class="tag '+(r.wide?'wide':'narrow')+'">'+(r.wide?'широкая тема':'узкая тема')+'</span>');
  var bd = (r.hook?'<dt>Заход</dt><dd>'+esc(r.hook)+'</dd>':'') + (r.struct?'<dt>Структура</dt><dd>'+esc(r.struct)+'</dd>':'') + (r.reward?'<dt>Награда</dt><dd>'+esc(r.reward)+'</dd>':'') + (r.core?'<dt>Ядро</dt><dd>'+esc(r.core)+'</dd>':'');
  return '<article class="rcard">'
    + '<div class="cover" style="background:linear-gradient(160deg,'+col[0]+','+col[1]+')"><em>'+fmult(r.mult)+'</em><span>'+fdur(r.dur)+'</span></div>'
    + '<div class="rbody">'
    +   '<div class="rtitle">'+(n?'№'+n+'. ':'')+esc(r.title)+'</div>'
    +   '<div class="rmeta"><span class="v">'+fnum(r.views)+'</span><span class="mult '+cls+'">'+fmult(r.mult)+'</span><span>'+fdate(r.ts)+'</span></div>'
    +   (tags.length?'<div class="tags">'+tags.join('')+'</div>':'') + who
    + '</div>'
    + '<details><summary>'+(r.core?'Разбор и подпись':'Подпись и цифры')+'</summary>'
    +   '<dl class="breakdown">'+bd+'<dt>Лайки</dt><dd class="num">'+fnum(r.likes)+' · '+pct(r.views?r.likes/r.views:null)+' от просмотров</dd><dt>Комментарии</dt><dd class="num">'+fnum(r.comments)+'</dd></dl>'
    +   (r.text?'<div class="transcript">'+esc(r.text).replace(/\n/g,'<br>')+'</div>':'')
    +   '<p style="margin-top:9px;font-size:13px"><a href="https://www.instagram.com/reel/'+esc(r.id)+'/" target="_blank" rel="noopener">Открыть рилс в Instagram</a></p>'
    + '</details></article>';
}
function barRow(label, sub, frac, val, cls){
  return '<div class="bar-row"><div class="lab"><span>'+esc(label)+'</span>'+(sub?'<i>'+esc(sub)+'</i>':'')+'</div><div class="track"><div class="fill '+(cls||'')+'" style="width:'+Math.max(2, Math.min(100, frac*100)).toFixed(1)+'%"></div></div><div class="val">'+val+'</div></div>';
}
function chips(items, cur, attr){
  return '<div class="chips">'+items.map(function(it){ return '<button class="chip" data-'+attr+'="'+esc(it[0])+'" aria-pressed="'+(String(cur)===String(it[0]))+'">'+esc(it[1])+(it[2]!=null?'<small>'+it[2]+'</small>':'')+'</button>'; }).join('')+'</div>';
}
function countBy(list, key){ var m = {}; list.forEach(function(x){ var k = typeof key==='function'?key(x):x[key]; m[k] = (m[k]||0)+1; }); return m; }


function vMe(){
  var M = D.me, me = A[M.nick];
  var fmt = {hit_rate:pct, views_per_follower:dec, per_month:dec, median_views:fnum, followers:fnum};
  var rows = M.kpis.map(function(k){
    var f = fmt[k.key]||dec, better = k.me != null && k.niche != null && k.me >= k.niche;
    return '<div>'+esc(k.label)+'</div><div class="n '+(better?'up':'dn')+'">'+f(k.me)+'</div><div class="n">'+f(k.niche)+'</div><div class="n">'+(k.rank||'—')+' из '+k.of+'</div>';
  }).join('');
  var mx = Math.max.apply(null, (M.dur_rows||[]).map(function(r){ return r.rate; }).concat([0.01]));
  var mine = M.hits.map(function(id){ return BYID[id]; }).filter(Boolean);
  var fresh = M.fresh.map(function(id){ return BYID[id]; }).filter(Boolean);
  return '<div><div class="eyebrow">Мой аккаунт · срез '+esc(D.snapshot)+'</div><h1>@'+esc(M.nick)+' против '+(D.authors.length-1)+' блогеров ниши</h1></div>'
    + '<p class="lead">Сравнение с travel-, лайфстайл- и узбекскими блогерами из базы: '+D.total.toLocaleString('ru')+' рилсов. Зелёным — где ты лучше медианы ниши.</p>'
    + '<div class="cmp"><div class="hd">Показатель</div><div class="hd">Ты</div><div class="hd">Медиана ниши</div><div class="hd">Место</div>'+rows+'</div>'
    + '<h2>Что делать, по цифрам</h2><div class="list">'+M.acts.map(function(a,i){ return '<div class="act"><div class="eyebrow">'+(i?'Шаг '+i:'Главное')+'</div><h3>'+esc(a.t)+'</h3><p>'+esc(a.b)+'</p></div>'; }).join('')+'</div>'
    + ((M.dur_rows||[]).length?'<div class="panel"><h2>Какая длина залетает у тебя</h2><p class="lead">Доля залётов среди твоих роликов такой длины.</p><div class="bars">'+M.dur_rows.map(function(h){ return barRow(h.k, h.n+' роликов', h.rate/mx, pct(h.rate), 'h'); }).join('')+'</div></div>':'')
    + '<h2>Твои лучшие залёты</h2><div class="list">'+mine.map(function(r,i){ return reelCard(r, i+1, false); }).join('')+'</div>'
    + '<h2>Свежие залёты соседей</h2><p class="lead">Самые сильные залёты из последних публикаций ниши. Берите идею и снимайте через свою историю.</p><div class="list">'+fresh.map(function(r,i){ return reelCard(r, i+1, true); }).join('')+'</div>'
    + '<button class="more" data-allhits="'+esc(M.nick)+'">Все мои залёты</button>';
}

function vCatalog(){
  var niches = countBy(D.authors,'niche'), langs = countBy(D.authors,'lang');
  var q = S.q.trim().toLowerCase();
  var list = D.authors.filter(function(a){
    return (S.lang==='all'||a.lang===S.lang) && (S.niche==='all'||a.niche===S.niche) && (!q || (a.name+' '+a.nick+' '+a.about+' '+a.niche).toLowerCase().indexOf(q) >= 0);
  });
  var key = {median:'median_views', hit:'hit_rate', followers:'followers', freq:'per_month', vpf:'views_per_follower'}[S.sort];
  list.sort(function(x,y){ return (y[key]||0)-(x[key]||0); });
  return '<div><div class="eyebrow">Каталог · срез '+esc(D.snapshot)+'</div><h1>'+(D.me?'Блогеры ниши':'Что залетает у конкурентов')+'</h1></div>'
    + '<p class="lead">Досье на каждого блогера и его лучшие рилсы. Залёт — рилс, который набрал в 2 раза больше медианы 30 соседних роликов того же автора. У каждого в базе от '+Math.min.apply(null,D.authors.map(function(a){return a.reels;}))+' до '+Math.max.apply(null,D.authors.map(function(a){return a.reels;}))+' последних рилсов.</p>'
    + '<div class="tiles"><div class="tile"><b>'+D.authors.length+'</b><span>блогеров в базе</span></div><div class="tile"><b>'+D.total.toLocaleString('ru')+'</b><span>рилсов в базе</span></div><div class="tile h"><b>'+HITS.length.toLocaleString('ru')+'</b><span>залётов ×2 и выше</span></div><div class="tile s"><b>'+D.supers+'</b><span>суперзалётов ×10</span></div></div>'
    + '<div class="controls"><div class="row"><input class="field" id="q" type="search" placeholder="Поиск: имя, ник" value="'+esc(S.q)+'" aria-label="Поиск блогера">'
    + '<select class="field" id="sort" aria-label="Сортировка">'+[['median','по медиане просмотров'],['hit','по доле залётов'],['followers','по подписчикам'],['freq','по частоте'],['vpf','просмотры на подписчика']].map(function(o){ return '<option value="'+o[0]+'"'+(S.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select></div>'
    + chips([['all','все языки',D.authors.length]].concat(Object.keys(langs).map(function(l){ return [l, LANG[l]||l, langs[l]]; })), S.lang, 'lang')
    + chips([['all','все группы',D.authors.length]].concat(Object.keys(niches).map(function(n){ return [n, n, niches[n]]; })), S.niche, 'niche')
    + '</div><div class="count">Показано '+list.length+' из '+D.authors.length+'</div>'
    + '<div class="list">'+(list.length ? list.map(function(a){
        return '<button class="acard" data-author="'+esc(a.nick)+'"><div class="ahead">'+ava(a)+'<div><div class="aname">'+esc(a.name)+'</div><div class="anick">@'+esc(a.nick)+(a.followers?' · <span class="num">'+fnum(a.followers)+'</span>':'')+'</div></div></div>'
          + (a.about?'<div class="about">'+esc(a.about.split('\n')[0]).slice(0,140)+'</div>':'')+'<div class="tags"><span class="tag">'+esc(a.niche)+'</span><span class="tag">'+(LANG[a.lang]||a.lang)+'</span></div>'
          + '<div class="kpis"><div class="kpi"><b>'+fnum(a.median_views)+'</b><span>медиана просмотров</span></div><div class="kpi"><b>'+pct(a.hit_rate)+'</b><span>доля залётов</span></div><div class="kpi"><b>'+dec(a.per_month)+'</b><span>рилсов в месяц</span></div></div></button>';
      }).join('') : '<div class="empty">Никого не нашлось. Сбросьте фильтры или измените запрос.</div>')+'</div>';
}

function vAuthor(nick){
  var a = A[nick];
  var mine = HITS.filter(function(r){ return r.a===nick; });
  var top = mine.slice(0, 8);
  var mx = Math.max.apply(null, (a.dur_rows||[]).map(function(r){ return r.rate; }).concat([0.01]));
  return '<div class="panel"><div class="eyebrow">Досье · срез '+esc(D.snapshot)+'</div><div class="ahead">'+ava(a, true)+'<div><h1 style="font-size:21px">'+esc(a.name)+'</h1><div class="anick">@'+esc(a.nick)+' · '+esc(a.niche)+' · '+(LANG[a.lang]||a.lang)+'</div></div></div>'
    + '<div class="kpis"><div class="kpi"><b>'+a.reels+'</b><span>рилсов в базе, с '+fdate(a.since)+'</span></div><div class="kpi"><b>'+fnum(a.followers)+'</b><span>подписчиков</span></div><div class="kpi"><b>'+dec(a.per_month)+'</b><span>рилсов в месяц</span></div>'
    + '<div class="kpi"><b>'+fnum(a.median_views)+'</b><span>медиана просмотров</span></div><div class="kpi"><b>'+pct(a.hit_rate)+'</b><span>залётов ×2</span></div><div class="kpi"><b>'+dec(a.views_per_follower)+'</b><span>просмотров на подписчика</span></div>'
    + '<div class="kpi"><b>'+fdur(a.avg_dur)+'</b><span>типичная длина</span></div><div class="kpi"><b>'+pct(a.likes_rate)+'</b><span>лайков от просмотров</span></div><div class="kpi"><b>'+pct(a.tag_share)+'</b><span>роликов с хэштегами</span></div></div></div>'
    + '<div class="panel"><h2>О блоге</h2>'+(a.about?'<p class="note">'+esc(a.about).replace(/\n/g,'<br>')+'</p>':'')+(a.strong?'<p class="note"><b>Что работает.</b> '+esc(a.strong)+'</p>':'')+(a.weak?'<p class="note"><b>Что слабее.</b> '+esc(a.weak)+'</p>':'')+'</div>'
    + ((a.dur_rows||[]).length?'<div class="panel"><h2>Какая длина залетает у автора</h2><p class="lead">Доля залётов среди роликов такой длины.</p><div class="bars">'+a.dur_rows.map(function(h){ return barRow(h.k, h.n+' роликов', h.rate/mx, pct(h.rate), 'h'); }).join('')+'</div></div>':'')
    + '<h2>Лучшие рилсы</h2><div class="list">'+(top.length?top.map(function(r,i){ return reelCard(r, i+1, false); }).join(''):'<div class="empty">Залётов в выборке нет.</div>')+'</div>'
    + (mine.length>top.length?'<button class="more" data-allhits="'+esc(nick)+'">Все залёты автора: '+mine.length+'</button>':'');
}

function vHits(){
  var q = S.hq.trim().toLowerCase();
  var nn = countBy(HITS, function(r){ return A[r.a].niche; }), ll = countBy(HITS, function(r){ return A[r.a].lang; });
  var list = HITS.filter(function(r){
    var a = A[r.a];
    return (S.hniche==='all'||a.niche===S.hniche) && (S.hlang==='all'||a.lang===S.hlang) && (!S.onlySuper||r['super']) && (!S.hAuthor||r.a===S.hAuthor)
      && (!q || (r.title+' '+r.text+' '+(r.core||'')+' '+r.a).toLowerCase().indexOf(q) >= 0);
  });
  if (S.hsort!=='mult') list = list.slice().sort(S.hsort==='views' ? function(x,y){ return y.views-x.views; } : function(x,y){ return y.ts-x.ts; });
  var shown = list.slice(0, S.hLimit);
  return '<div><div class="eyebrow">Залёты · '+HITS.length.toLocaleString('ru')+' из '+D.total.toLocaleString('ru')+' рилсов</div><h1>Рилсы, которые набрали выше нормы</h1></div>'
    + '<div class="controls"><div class="row"><input class="field" id="hq" type="search" placeholder="Поиск по подписи" value="'+esc(S.hq)+'" aria-label="Поиск по подписи">'
    + '<select class="field" id="hsort" aria-label="Сортировка">'+[['mult','по силе залёта'],['views','по просмотрам'],['date','сначала новые']].map(function(o){ return '<option value="'+o[0]+'"'+(S.hsort===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select></div>'
    + chips([['all','все группы',HITS.length]].concat(Object.keys(nn).map(function(n){ return [n,n,nn[n]]; })), S.hniche, 'hniche')
    + chips([['all','все языки',null]].concat(Object.keys(ll).map(function(l){ return [l,LANG[l]||l,ll[l]]; })), S.hlang, 'hlang')
    + '<div class="chips"><button class="chip" id="onlysuper" aria-pressed="'+S.onlySuper+'">только суперзалёты ×10</button>'+(S.hAuthor?'<button class="chip" id="clearauthor" aria-pressed="true">'+esc(A[S.hAuthor].name)+' ✕</button>':'')+'</div></div>'
    + '<div class="count">Найдено '+list.length.toLocaleString('ru')+'</div>'
    + '<div class="list">'+(shown.length ? shown.map(function(r,i){ return reelCard(r, i+1, true); }).join('') : '<div class="empty">Под эти фильтры ничего не попало.</div>')+'</div>'
    + (list.length > shown.length ? '<button class="more" id="more">Показать ещё '+Math.min(30, list.length-shown.length)+'</button>' : '');
}

var IDEAS = (function(){
  var m = {};
  TAGGED.forEach(function(r){ var o = m[r.core] = m[r.core]||{core:r.core, theme:r.theme, hits:0, views:0, authors:{}, best:0}; o.hits++; o.views += r.views; o.best = Math.max(o.best, r.mult);
    var au = o.authors[r.a] = o.authors[r.a]||{n:0, views:0}; au.n++; au.views += r.views; });
  return Object.keys(m).map(function(k){ var o = m[k]; o.na = Object.keys(o.authors).length; return o; }).sort(function(x,y){ return y.na-x.na || y.views-x.views; });
})();
function vIdeas(){
  if (!IDEAS.length) return '<div><div class="eyebrow">Смысловые ядра</div><h1>Идеи, которые залетают у разных блогеров</h1></div><div class="panel"><p class="note"><b>Раздел пока пуст.</b> Чтобы вытащить из рилса мысль, ради которой его смотрели, нужна расшифровка речи. Она появится, когда будет открыт доступ к видеофайлам.</p></div>';
  var multi = IDEAS.filter(function(i){ return i.na >= 2; });
  var list = S.ideasMulti && multi.length ? multi : IDEAS;
  return '<div><div class="eyebrow">Смысловые ядра · размечено '+TAGGED.length+' залётов</div><h1>Идеи, которые залетают у разных блогеров</h1></div>'
    + '<p class="lead">Ядро — мысль, ради которой рилс смотрели. Пока размечены самые сильные залёты и только по подписям, без расшифровки речи.</p>'
    + '<div class="chips"><button class="chip" data-multi="1" aria-pressed="'+(S.ideasMulti&&multi.length>0)+'">залетело у 2+ блогеров<small>'+multi.length+'</small></button><button class="chip" data-multi="0" aria-pressed="'+(!(S.ideasMulti&&multi.length>0))+'">все ядра<small>'+IDEAS.length+'</small></button></div>'
    + '<div class="list">'+list.map(function(i, n){
        var ex = Object.keys(i.authors).sort(function(x,y){ return i.authors[y].views-i.authors[x].views; }).slice(0,6);
        return '<article class="idea"><div class="eyebrow">№'+(n+1)+(i.theme?' · '+esc(i.theme):'')+'</div><h3>'+esc(i.core)+'</h3>'
          + '<div class="im"><span><b>'+i.na+'</b> блогеров</span><span><b>'+i.hits+'</b> залётов</span><span><b>'+fnum(i.views)+'</b> просмотров</span><span>лучший <b>'+fmult(i.best)+'</b></span></div>'
          + '<details style="grid-column:auto"><summary>У кого залетело</summary><div class="ex">'+ex.map(function(k){ return '<div><span>'+esc(A[k].name)+' · '+i.authors[k].n+' рилс.</span><span>'+fnum(i.authors[k].views)+'</span></div>'; }).join('')+'</div></details></article>';
      }).join('')+'</div>';
}

function block(b, cls){
  var mx = Math.max.apply(null, b.rows.map(function(r){ return r.rate; }).concat([0.01]));
  return '<div class="panel"><div><span class="verdict '+(b.yes?'yes':'no')+'">'+(b.yes?'есть разница':'разницы нет')+'</span></div><h2>'+esc(b.t)+'</h2><p class="lead">'+esc(b.l)+'</p><div class="bars">'
    + b.rows.map(function(r){ return barRow(r.k, r.n.toLocaleString('ru')+' рилсов', r.rate/mx, pct(r.rate), cls); }).join('')+'</div></div>';
}
function vInsights(){
  var yes = D.insights.filter(function(b){ return b.yes; }).sort(function(x,y){ return y.sp-x.sp; }), no = D.insights.filter(function(b){ return !b.yes && b.rows.length>1; });
  var fmx = Math.max.apply(null, (D.freq||[]).map(function(r){ return r.rate; }).concat([0.01]));
  return '<div><div class="eyebrow">Выводы · '+D.scored.toLocaleString('ru')+' рилсов, '+D.authors.length+' блогеров</div><h1>Что связано с залётом, а что нет</h1></div>'
    + '<p class="lead">В среднем залетает '+pct(D.base_rate)+' рилсов. Ниже — как эта доля меняется от одного признака. Разницу меньше 5 пунктов считаю шумом. Это связь, а не доказанная причина.</p>'
    + '<h2>Где разница есть</h2>' + (yes.length ? yes.map(function(b){ return block(b, 'h'); }).join('') : '<div class="empty">Признаков с заметной разницей нет.</div>')
    + '<h2>Где разницы нет</h2>' + (no.length ? no.map(function(b){ return block(b, 'g'); }).join('') : '<div class="empty">Все проверенные признаки дают разницу.</div>')
    + ((D.freq||[]).length?'<h2>Частота публикаций</h2><div class="panel"><p class="lead">Средняя доля залётов у блогеров с разной частотой. Частота не делает каждый ролик сильнее, но даёт больше попыток.</p><div class="bars">'+D.freq.map(function(r){ return barRow(r.k, r.n+' блогеров'+(r.vpf?' · '+dec(r.vpf)+' просм. на подписчика':''), r.rate/fmx, pct(r.rate), ''); }).join('')+'</div></div>':'');
}

function render(){
  var sub = !!S.author;
  $('#bar').classList.toggle('sub', sub);
  $('#brand').textContent = sub ? A[S.author].name : (D.me ? 'Разведка · @'+D.me.nick : 'Разведка Reels');
  view.innerHTML = sub ? vAuthor(S.author) : S.tab==='me' ? vMe() : S.tab==='catalog' ? vCatalog() : S.tab==='hits' ? vHits() : S.tab==='ideas' ? vIdeas() : vInsights();
  document.querySelectorAll('nav.tabs button').forEach(function(b){ if(b.dataset.tab===S.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if (TG) { try { sub ? TG.BackButton.show() : TG.BackButton.hide(); } catch(e){} }
}
function refocus(id){ var el = $('#'+id); if(el){ el.focus(); var v = el.value; el.value=''; el.value=v; } }
view.addEventListener('input', function(e){
  if (e.target.id==='q'){ S.q = e.target.value; render(); refocus('q'); }
  if (e.target.id==='hq'){ S.hq = e.target.value; S.hLimit = 30; render(); refocus('hq'); }
});
view.addEventListener('change', function(e){
  if (e.target.id==='sort'){ S.sort = e.target.value; render(); }
  if (e.target.id==='hsort'){ S.hsort = e.target.value; render(); }
});
view.addEventListener('click', function(e){
  var t = e.target.closest('[data-author],[data-lang],[data-niche],[data-hniche],[data-hlang],[data-multi],[data-allhits],#more,#onlysuper,#clearauthor');
  if (!t) return;
  if (t.dataset.author){ openAuthor(t.dataset.author); }
  else if (t.dataset.lang){ S.lang = t.dataset.lang; render(); }
  else if (t.dataset.niche){ S.niche = t.dataset.niche; render(); }
  else if (t.dataset.hniche){ S.hniche = t.dataset.hniche; S.hLimit = 30; render(); }
  else if (t.dataset.hlang){ S.hlang = t.dataset.hlang; S.hLimit = 30; render(); }
  else if (t.dataset.multi){ S.ideasMulti = t.dataset.multi==='1'; render(); }
  else if (t.dataset.allhits){ S.hAuthor = t.dataset.allhits; S.hniche='all'; S.hlang='all'; S.onlySuper=false; S.hq=''; go('hits'); }
  else if (t.id==='more'){ S.hLimit += 30; render(); }
  else if (t.id==='onlysuper'){ S.onlySuper = !S.onlySuper; S.hLimit = 30; render(); }
  else if (t.id==='clearauthor'){ S.hAuthor = null; render(); }
});
$('nav.tabs').addEventListener('click', function(e){ var b = e.target.closest('button[data-tab]'); if(b){ if(b.dataset.tab!=='hits') S.hAuthor = null; go(b.dataset.tab); } });
$('#back').addEventListener('click', back);
window.addEventListener('hashchange', function(){ var h = location.hash.slice(1); if(TABS.indexOf(h)>=0 && (h!==S.tab || S.author)){ S.tab = h; S.author = null; render(); } });

$('#snap').textContent = 'срез ' + D.snapshot;
$('#demo').hidden = !D.demo;
$('#n-catalog').textContent = D.authors.length;
$('#n-hits').textContent = HITS.length.toLocaleString('ru');
$('#n-ideas').textContent = IDEAS.length || '—';
if (!IDEAS.length) $('nav.tabs button[data-tab="ideas"]').style.display = 'none';
if (D.me) $('nav.tabs button[data-tab="me"]').style.display = '';
(function(){ var bs = [].filter.call(document.querySelectorAll('nav.tabs button'), function(b){ return b.style.display !== 'none'; }); $('nav.tabs div').style.gridTemplateColumns = 'repeat('+bs.length+',1fr)'; })();
var TG = null;
if (/github\.io$/.test(location.hostname) || /tgWebApp/.test(location.hash)) {
  var s = document.createElement('script'); s.src = 'https://telegram.org/js/telegram-web-app.js';
  s.onload = function(){ try { TG = window.Telegram.WebApp; TG.ready(); TG.expand(); TG.BackButton.onClick(back); if(TG.setHeaderColor) TG.setHeaderColor('#EDF0F4'); } catch(e){ TG = null; } render(); };
  document.head.appendChild(s);
}
var h0 = location.hash.slice(1); if(TABS.indexOf(h0)>=0 && (h0!=='me'||D.me)) S.tab = h0;
render();
})();

</script>
</body>
</html>
